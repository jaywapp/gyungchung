<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>웰컴 시안 03 구단 소개형</title>
<meta name="description" content="GCFC 워드마크와 운영진 소개로 모임을 먼저 보여 주고 회칙과 앱 설치로 이어지는 경충FC 웰컴 페이지 시안">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@900&display=swap">

<style>
/* ==========================================================================
   Concept 03: the club introduces itself.
   Navy field with the wordmark on a chalked court, the people who run the
   club, the rules one chapter at a time, and a pitch-green close for the
   app. Navy and pitch are the live site's panel colours in both themes.
   ========================================================================== */
#page { --gutter: clamp(20px, 6vw, 96px); --sticky-h: 0px; }

/* Hero */
.hero {
  position: relative;
  display: grid;
  grid-template-rows: auto 1fr;
  min-height: min(780px, calc(100dvh - var(--proto-h)));
  padding: 0 var(--gutter) clamp(36px, 6vh, 64px);
  background: var(--navy);
  color: var(--on-navy);
  overflow: hidden;
}

.hero-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: 72px;
}

.crest {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: var(--tap);
  color: inherit;
  font-size: 18px;
  font-weight: 800;
  letter-spacing: -.02em;
  text-decoration: none;
}

.crest span {
  width: 36px;
  height: 36px;
  display: grid;
  place-items: center;
  border-radius: var(--radius-inner);
  background: var(--highlight);
  color: var(--on-highlight);
  font-family: var(--font-display), var(--font-sans), sans-serif;
  font-size: 14px;
  font-weight: 900;
}

.hero-nav { display: flex; gap: clamp(4px, 2vw, 20px); }

.hero-nav a {
  display: inline-flex;
  align-items: center;
  min-height: var(--tap);
  padding: 0 8px;
  color: var(--muted-on-navy);
  font-weight: 700;
  text-decoration: none;
  transition: color .2s;
}

.hero-nav a:hover { color: var(--on-navy); }

.hero-body {
  display: grid;
  grid-template-columns: minmax(0, 5fr) minmax(0, 6fr);
  align-items: center;
  gap: 32px clamp(32px, 5vw, 80px);
}

.hero h1 {
  font-size: clamp(32px, 4.2vw, 58px);
  font-weight: 900;
  line-height: 1.14;
  letter-spacing: -.035em;
  animation: rise .7s var(--ease-out) both;
}

.hero h1 span, .hero h1 em { display: block; }
.hero h1 em { color: var(--highlight); font-style: normal; }

.hero-lead {
  max-width: 26em;
  margin-top: 18px;
  color: #c9d5e0;
  font-size: clamp(17px, 1.5vw, 20px);
  animation: rise .7s var(--ease-out) .08s both;
}

.hero-actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px 18px;
  margin-top: 30px;
  animation: rise .7s var(--ease-out) .16s both;
}

.on-dark.cta.ghost { box-shadow: inset 0 0 0 2px var(--on-navy); color: var(--on-navy); }
.on-dark.cta.ghost:hover { background: var(--on-navy); color: var(--navy); }
.on-dark.text-link { color: var(--highlight); }

@keyframes rise { from { opacity: 0; transform: translateY(14px); } }

/* The court is chalked in, then the ball lands as the wordmark's full stop. */
.court { position: relative; }
.court > svg { width: 100%; height: auto; overflow: visible; }

.court-lines path,
.court-lines circle {
  fill: none;
  stroke: rgba(255, 255, 255, .16);
  stroke-width: 1.2;
  stroke-dasharray: 1;
  stroke-dashoffset: 0;
  animation: chalk 1.1s var(--ease-out) both;
  animation-delay: calc(var(--i) * 90ms);
}

@keyframes chalk { from { stroke-dashoffset: 1; } }

.wordmark {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 72%;
  transform: translate(-50%, -50%);
}

.wordmark svg { width: 100%; height: auto; overflow: visible; animation: rise .8s var(--ease-out) .25s both; }

.ball {
  position: absolute;
  left: 95.57%;
  top: 73.96%;
  width: 5.05%;
  aspect-ratio: 1;
  border-radius: 50%;
  background: var(--highlight);
  translate: -50% -50%;
  animation: lob 1.15s cubic-bezier(.3, 0, .2, 1) .55s both;
}

@keyframes lob {
  0% { transform: translate(-1500%, -260%) scale(.8); opacity: 0; }
  12% { opacity: 1; }
  55% { transform: translate(-560%, -620%) scale(1.5); }
  86% { transform: translate(0, 0) scale(1); }
  93% { transform: translate(0, -38%) scale(1); }
  100% { transform: none; opacity: 1; }
}

/* Sections */
.section { padding: clamp(56px, 9vh, 104px) var(--gutter); scroll-margin-top: var(--proto-h); }
.section-head { max-width: 40em; margin-bottom: 36px; }
.section-head h2 { font-size: clamp(28px, 3.6vw, 46px); font-weight: 900; letter-spacing: -.03em; }
.section-head p { margin-top: 12px; color: var(--body); font-size: 18px; }
.section-head .example-tag { margin-top: 16px; }

/* People: the lead officer on the pitch panel, the rest as a sheet */
.people { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: clamp(24px, 4vw, 64px); align-items: start; }

.lead-card {
  position: relative;
  display: grid;
  align-content: end;
  min-height: 300px;
  padding: 32px;
  border: 1px solid var(--pitch-line);
  border-radius: var(--radius-card);
  background: var(--pitch);
  color: var(--on-pitch);
  overflow: hidden;
}

.lead-card::before {
  content: "";
  position: absolute;
  right: -90px;
  top: -90px;
  width: 260px;
  height: 260px;
  border: 1.5px solid var(--pitch-divider);
  border-radius: 50%;
}

.lead-card .role { color: var(--highlight); font-weight: 800; }
.lead-card b { display: block; margin-top: 6px; font-size: clamp(26px, 3vw, 36px); font-weight: 900; line-height: 1.2; letter-spacing: -.03em; }
.lead-card p { margin-top: 10px; color: var(--muted-on-pitch); }

.sheet-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 40px; }
.sheet-list.single { grid-template-columns: 1fr; }
.sheet-list li { padding: 20px 0; border-top: 2px solid var(--ink); }
.sheet-list .role { color: var(--brand); font-weight: 800; }
.sheet-list b { display: block; margin-top: 4px; font-size: 21px; font-weight: 800; line-height: 1.3; }
.sheet-list p { margin-top: 6px; color: var(--body); font-size: 15px; }

/* Rules: one chapter per page */
.rules-band { background: var(--surface); border-block: 1px solid var(--card-edge); }

.charter { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: clamp(28px, 5vw, 72px); align-items: start; }
.charter-nav { position: sticky; top: calc(var(--proto-h) + 20px); }
.charter-nav ol { display: grid; gap: 4px; }

.charter-nav button {
  width: 100%;
  min-height: 52px;
  display: grid;
  grid-template-columns: 4.2em minmax(0, 1fr);
  align-items: center;
  gap: 4px;
  padding: 8px 14px;
  border: 0;
  border-radius: var(--radius-control);
  background: none;
  color: var(--body);
  font-weight: 700;
  text-align: left;
  cursor: pointer;
  transition: background-color .2s, color .2s;
}

.charter-nav button span { color: var(--muted); font-size: 14px; }
.charter-nav button:hover { background: var(--surface-sunken); color: var(--ink); }
.charter-nav button[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); font-weight: 900; }
.charter-nav button[aria-pressed="true"] span { color: inherit; opacity: .78; }

.charter-pick { display: none; }

.charter-pick select {
  width: 100%;
  min-height: 52px;
  padding: 0 14px;
  border: 1px solid var(--chalk-strong);
  border-radius: var(--radius-control);
  background: var(--surface);
  font-size: 17px;
  font-weight: 800;
}

.charter-pick label { display: block; margin-bottom: 6px; font-size: 14px; font-weight: 800; }

.charter-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 20px; margin-bottom: 14px; color: var(--body); font-size: 15px; }
.charter-tools dl { display: flex; flex-wrap: wrap; gap: 4px 18px; margin: 0; }
.charter-tools dl div { display: flex; gap: 6px; }
.charter-tools dt { color: var(--muted); }
.charter-tools dd { margin: 0; color: var(--ink); font-weight: 700; }
.charter-tools .text-link { margin-left: auto; font-size: 15px; }

.charter-page { max-width: 68ch; scroll-margin-top: calc(var(--proto-h) + 16px); }
.charter-page:focus-visible { outline-offset: 8px; }
.charter-page h3 { margin: 0 0 22px; font-size: clamp(22px, 2.4vw, 28px); font-weight: 900; }
.charter-page h3 span { display: block; margin-bottom: 2px; color: var(--brand); font-size: 15px; font-weight: 800; letter-spacing: 0; }
.charter-page h3:not(:first-child) { margin-top: 48px; padding-top: 32px; border-top: 1px solid var(--line); }

.article { scroll-margin-top: calc(var(--proto-h) + 20px); }
.article + .article { margin-top: 26px; }
.article h4 { margin: 0 0 8px; font-size: 18px; font-weight: 800; }
.article h4 span { margin-right: 8px; color: var(--brand); }
.article p { color: var(--body); font-size: 17px; line-height: 1.85; }
.article p + p { margin-top: 12px; }
.article ol { margin-top: 10px; padding-left: 1.5em; list-style: decimal; color: var(--body); font-size: 17px; line-height: 1.85; }
.article ol li::marker { color: var(--muted); font-weight: 700; }

.pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--line); }
.pager button { min-height: 52px; display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; border: 1px solid var(--chalk-strong); border-radius: var(--radius-control); background: none; font-weight: 800; text-align: left; cursor: pointer; }
.pager button:hover:not(:disabled) { background: var(--surface-sunken); }
.pager button:disabled { color: var(--disabled-ink); border-color: var(--line); cursor: not-allowed; }
.pager button:last-child { margin-left: auto; text-align: right; }

/* Close: the app, on the pitch */
.kickoff { background: var(--pitch); color: var(--on-pitch); border-top: 1px solid var(--pitch-line); }
.kickoff-grid { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: clamp(32px, 5vw, 80px); align-items: start; }
.kickoff h2 { margin-top: 22px; font-size: clamp(28px, 3.6vw, 46px); font-weight: 900; letter-spacing: -.03em; }
.kickoff-app img { width: 84px; height: 84px; border-radius: 20px; box-shadow: 0 10px 28px rgba(0, 0, 0, .28); }
.kickoff-lead { margin-top: 12px; color: var(--muted-on-pitch); font-size: 18px; }
.kickoff-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; margin-top: 26px; }
.kickoff .on-dark.cta.ghost { box-shadow: inset 0 0 0 2px var(--on-pitch); color: var(--on-pitch); }
.kickoff .on-dark.cta.ghost:hover { background: var(--on-pitch); color: var(--pitch); }

.app-meta { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 16px 0 0; color: var(--muted-on-pitch); font-size: 15px; }
.app-meta div { display: flex; gap: 6px; }
.app-meta dd { margin: 0; color: var(--on-pitch); font-weight: 700; font-variant-numeric: tabular-nums; }
.app-msg { display: flex; align-items: flex-start; gap: 8px; margin-top: 16px; color: var(--muted-on-pitch); font-size: 15px; }
.app-msg .ic { margin-top: 2px; }
.app-msg button { min-height: 0; padding: 0; font-size: 15px; }
.ios-line { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--pitch-divider); color: var(--muted-on-pitch); font-size: 15px; }
.ios-line b { color: var(--on-pitch); }

.guides { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px 40px; }
.guides.single { grid-template-columns: 1fr; max-width: 30em; }
.guides h3 { margin-bottom: 6px; font-size: 20px; font-weight: 800; }
.guides ol { counter-reset: g; }
.guides li { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 8px; padding: 16px 0; border-bottom: 1px solid var(--pitch-divider); counter-increment: g; color: var(--muted-on-pitch); }
.guides li::before { content: counter(g); color: var(--highlight); font-family: var(--font-display), var(--font-sans), sans-serif; font-size: 22px; font-weight: 900; line-height: 1.2; }
.guides li b { display: block; color: var(--on-pitch); }

/* States */
.blank { max-width: 40em; padding: 28px; border: 1px dashed var(--chalk-strong); border-radius: var(--radius-card); color: var(--body); }
.blank b { display: block; margin-bottom: 4px; color: var(--ink); font-size: 19px; }
.blank .cta { margin-top: 16px; }
.blank.fail { border-style: solid; border-color: var(--danger-ink); background: var(--danger-bg); }
.loading-stack { display: grid; gap: 14px; max-width: 760px; }
.loading-stack .skeleton { height: 22px; }
.loading-stack .skeleton:nth-child(1) { height: 120px; }
.loading-stack .skeleton:last-child { width: 60%; }

.foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; padding: 28px var(--gutter); background: var(--navy); color: var(--muted-on-navy); font-size: 14px; }
.foot .gcfc-logo { width: 104px; }
.foot a { display: inline-flex; align-items: center; min-height: var(--tap); color: var(--highlight); font-weight: 700; }

@media (max-width: 900px) {
  .hero { min-height: 0; }
  .hero-top { min-height: 64px; }
  .hero-nav a { padding: 0 6px; font-size: 15px; }
  .hero-body { grid-template-columns: 1fr; padding-top: 20px; }
  .court { max-width: 520px; margin-top: 12px; }
  .people { grid-template-columns: 1fr; }
  .lead-card { min-height: 220px; padding: 26px; }
  .sheet-list { grid-template-columns: 1fr; }
  .charter { grid-template-columns: minmax(0, 1fr); gap: 20px; }
  .charter-nav { position: static; }
  .charter-nav ol { display: none; }
  .charter-pick { display: block; }
  .charter-tools .text-link { margin-left: 0; }
  .kickoff-grid { grid-template-columns: 1fr; }
  .guides { grid-template-columns: 1fr; }
}

@media (max-width: 420px) {
  .hero-actions .cta,
  .kickoff-actions .cta { width: 100%; }
  .crest { font-size: 16px; }
  .pager button { flex: 1 1 0; padding: 8px 12px; }
}
</style>
</head>
<body>
<!--
THESIS: The club introduces itself before it asks for anything. The wordmark on a chalked court is the first thing seen, people come before paperwork. It refuses the utility page that treats a club as a download link.
OWN-WORLD: Live GCFC tokens used at field scale. Navy hero, off-white body, white rules band, pitch-green close. Lime only for the ball, the lead officer's role and the download action.
STORY: A newcomer feels which club this is, meets who runs it, reads the rules a chapter at a time, then installs the app.
FIRST VIEWPORT: Navy field. Welcome headline and three actions left, GCFC wordmark on court lines right, the lime ball landing as its full stop.
FORM: Club introduction (brief-pinned starting point "구단 소개형"; no seed roll).
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
-->
<div id="page">

  <header class="hero">

        <a href="#rules">회칙</a>
        <a href="#download">앱 설치</a>
      </nav>
    </div>
    <div class="hero-body">
      <div>
        <h1><span>경충FC에 오신 것을</span> <em>환영합니다</em></h1>
        <p class="hero-lead">회칙과 운영진을 확인하고 앱으로 함께 시작하세요.</p>
        <div class="hero-actions" id="hero-actions"></div>
      </div>

          <span class="ball"></span>
        </div>
      </div>
    </div>
  </header>

  <main id="main">
    <section class="section" id="staff" aria-labelledby="staff-title">
      <div class="section-head">
        <h2 id="staff-title">모임을 운영하는 사람들</h2>
        <p>일정과 회비, 계정 등록을 맡고 있습니다. 궁금한 점은 운영진에게 물어보세요.</p>
        <p class="example-tag" id="staff-tag"><i data-ic="info"></i><span></span></p>
      </div>
      <div id="staff-body"></div>
    </section>

    <section class="section rules-band" id="rules" aria-labelledby="rules-title">
      <div class="section-head">
        <h2 id="rules-title">함께 지키는 약속</h2>
        <p>경충FC의 회칙입니다. 한 장씩 넘겨 읽을 수 있습니다.</p>
        <p class="example-tag" id="rules-tag"><i data-ic="info"></i><span></span></p>
      </div>
      <div id="rules-body"></div>
    </section>

    <section class="section kickoff" id="download" aria-labelledby="download-title">
      <div class="kickoff-grid">
        <div class="kickoff-app">
          <img src="../../../../app/icon.png" alt="" width="84" height="84">
          <h2 id="download-title">앱으로 함께 시작하세요</h2>
          <p class="kickoff-lead">앱 설치는 선택입니다. 웹에서도 같은 계정으로 그대로 이용할 수 있습니다.</p>
          <div id="app-body"></div>
        </div>
        <div class="guides" id="guides"></div>
      </div>
    </section>
  </main>

  <footer class="foot">
    <span data-logo-dark></span>
    <span>경충FC 웰컴 페이지 시안. 회칙과 운영진 정보는 예시입니다.</span>
    <a href="#main">맨 위로</a>
  </footer>
</div>

<script src="../shared/icons.js"></script>
<script src="../shared/welcome.js"></script>
<script>
(function () {
  "use strict";
  var W = window.W, esc = W.esc, icon = W.icon, $ = function (id) { return document.getElementById(id); };

  W.init({ name: "시안 03 구단 소개형", key: "concept-03", controls: ["android", "ios", "rules", "staff", "page"] });

  document.querySelector("[data-logo-dark]").innerHTML = W.logo("always-dark");
  $("staff-tag").querySelector("span").textContent = W.copy.staffExample;
  $("rules-tag").querySelector("span").textContent = W.copy.rulesExample;

  var chapter = 0, showAll = false;

  function pageBlock(kind) {
    if (W.state.page === "loading") return '<div class="loading-stack" aria-busy="true"><span class="sr-only">' + kind + ' 불러오는 중</span><span class="skeleton"></span><span class="skeleton"></span><span class="skeleton"></span><span class="skeleton"></span></div>';
    if (W.state.page === "error") return '<div class="blank fail" role="alert"><b>' + kind + '을 불러오지 못했습니다</b>잠시 후 다시 시도해 주세요. 앱 설치 안내는 그대로 볼 수 있습니다.<br><button type="button" class="cta small" data-retry>' + icon("refresh-cw") + "다시 시도</button></div>";
    return null;
  }

  function downloadButton() {
    var a = W.android();
    if (a.status === "hidden") return "";
    return '<a class="cta secondary" href="' + a.url + '">' + icon("download") + esc(W.copy.download) + "</a>";
  }

  function renderHero() {
    $("hero-actions").innerHTML = downloadButton() +
      '<a class="cta ghost on-dark" href="#rules">' + esc(W.copy.rules) + "</a>" +
      '<a class="text-link on-dark" href="' + W.webUrl + '">' + esc(W.copy.web) + "</a>";
  }

  function renderStaff() {
    var block = pageBlock("운영진 소개"), s = W.staff(), el = $("staff-body");
    $("staff-tag").hidden = !!block || !s.length;
    if (block) { el.innerHTML = block; return; }
    if (!s.length) { el.innerHTML = '<div class="blank"><b>운영진 소개를 준비하고 있습니다</b>소개가 등록되면 이 자리에 표시됩니다.</div>'; return; }
    var lead = s[0], rest = s.slice(1);
    el.innerHTML = '<div class="people"><div class="lead-card"><span class="role">' + esc(lead.role) + "</span><b>" + esc(lead.name) + "</b>" + (lead.bio ? "<p>" + esc(lead.bio) + "</p>" : "") + "</div>" +
      '<ul class="sheet-list' + (rest.length < 3 ? " single" : "") + '">' + rest.map(function (m) {
        return '<li><span class="role">' + esc(m.role) + "</span><b>" + esc(m.name) + "</b>" + (m.bio ? "<p>" + esc(m.bio) + "</p>" : "") + "</li>";
      }).join("") + "</ul></div>";
  }

  function chapterHtml(c) {
    return '<h3 id="' + c.id + '"><span>' + esc(c.no) + "</span>" + esc(c.title) + "</h3>" + c.articles.map(function (a) {
      return '<article class="article" id="' + a.id + '"><h4><span>' + a.label + "</span>" + esc(a.title) + "</h4>" +
        a.paras.map(function (p) { return "<p>" + esc(p) + "</p>"; }).join("") +
        (a.list.length ? "<ol>" + a.list.map(function (l) { return "<li>" + esc(l) + "</li>"; }).join("") + "</ol>" : "") + "</article>";
    }).join("");
  }

  function renderRules() {
    var block = pageBlock("회칙"), r = W.rules(), el = $("rules-body");
    $("rules-tag").hidden = !!block || !r;
    if (block) { el.innerHTML = block; return; }
    if (!r) { el.innerHTML = '<div class="blank"><b>회칙을 준비하고 있습니다</b>등록되면 이 자리에서 읽을 수 있습니다. 급한 문의는 운영진에게 해 주세요.</div>'; return; }
    if (chapter >= r.chapters.length) chapter = 0;
    var range = function (c) { var f = c.articles[0].n, l = c.articles[c.articles.length - 1].n; return f === l ? f + "조" : f + "~" + l + "조"; };
    var prev = r.chapters[chapter - 1], next = r.chapters[chapter + 1];
    el.innerHTML = '<div class="charter"><nav class="charter-nav" aria-label="회칙 목차"><ol>' +
      r.chapters.map(function (c, i) {
        return '<li><button type="button" data-chapter="' + i + '" aria-pressed="' + (!showAll && i === chapter) + '"><span>' + esc(c.no) + "</span>" + esc(c.title) + "</button></li>";
      }).join("") + '</ol><div class="charter-pick"><label for="chapter-pick">읽을 장 고르기</label><select id="chapter-pick"' + (showAll ? " disabled" : "") + ">" +
      r.chapters.map(function (c, i) { return '<option value="' + i + '"' + (i === chapter ? " selected" : "") + ">" + esc(c.no + " " + c.title + " (" + range(c) + ")") + "</option>"; }).join("") +
      "</select></div></nav><div>" +
      '<div class="charter-tools"><dl><div><dt>시행일</dt><dd>' + esc(r.effective.replace(" 시행", "")) + "</dd></div>" +
      (r.revised ? "<div><dt>개정일</dt><dd>" + esc(r.revised.replace(" 개정", "")) + "</dd></div>" : "") +
      "<div><dt>분량</dt><dd>" + r.chapters.length + "장 " + r.articleCount + '조</dd></div></dl><button type="button" class="text-link" data-all aria-pressed="' + showAll + '">' + (showAll ? "한 장씩 보기" : "전체 펼쳐 읽기") + "</button></div>" +
      '<div class="charter-page" id="charter-page" tabindex="-1">' + (showAll ? r.chapters.map(chapterHtml).join("") : chapterHtml(r.chapters[chapter])) + "</div>" +
      (showAll ? "" : '<div class="pager"><button type="button" data-chapter="' + (chapter - 1) + '"' + (prev ? "" : " disabled") + ">" + icon("chevron-left") + (prev ? esc(prev.no + " " + prev.title) : "처음입니다") + '</button><button type="button" data-chapter="' + (chapter + 1) + '"' + (next ? "" : " disabled") + ">" + (next ? esc(next.no + " " + next.title) : "마지막입니다") + icon("chevron-right") + "</button></div>") +
      "</div></div>";
  }

  function goChapter(i, focus) {
    showAll = false;
    chapter = i;
    renderRules();
    var page = $("charter-page");
    if (page && focus) {
      page.focus({ preventScroll: true });
      if (page.getBoundingClientRect().top < 0) page.scrollIntoView();
    }
  }

  function renderApp() {
    var a = W.android(), i = W.ios(), html = "";
    if (a.status !== "hidden") {
      html += (a.version ? '<dl class="app-meta"><div><dt>버전</dt><dd>' + a.version + "</dd></div><div><dt>크기</dt><dd>" + a.size + '</dd></div><div><dt class="sr-only">확인일</dt><dd>' + a.checked + "</dd></div></dl>" : "") +
        (a.status === "loading" ? '<p class="app-msg" role="status">' + icon("loader-circle") + esc(a.message) + "</p>" : "") +
        (a.status === "fail" ? '<p class="app-msg" role="status">' + icon("triangle-alert") + "<span>" + esc(a.message) + ' <button type="button" class="text-link on-dark" data-android-retry>다시 확인</button></span></p>' : "");
    }
    html += '<div class="kickoff-actions">' + downloadButton() + '<a class="cta ghost on-dark" href="' + W.webUrl + '">' + esc(W.copy.web) + "</a></div>";
    if (i) html += '<p class="ios-line">' + icon("apple") + "<span><b>" + esc(i.title) + "</b> " + esc(i.note) + "</span>" + (i.action ? '<a class="text-link on-dark" href="#download" data-ios-demo>' + esc(i.action) + icon("external-link") + "</a>" : "") + "</p>";
    $("app-body").innerHTML = html;

    var steps = function (title, list) { return "<div><h3>" + title + "</h3><ol>" + list.map(function (s) { return "<li><span><b>" + esc(s[0]) + "</b>" + esc(s[1]) + "</span></li>"; }).join("") + "</ol></div>"; };
    var g = $("guides");
    g.className = "guides" + (a.status === "hidden" ? " single" : "");
    g.innerHTML = (a.status === "hidden" ? "" : steps("설치 방법", W.copy.installSteps)) + steps("계정 안내", W.copy.accountSteps);
  }

  function render() { renderHero(); renderStaff(); renderRules(); renderApp(); }
  render();
  W.on(render);

  document.addEventListener("click", function (e) {
    if (e.target.closest("[data-retry]")) W.set("page", "ok");
    if (e.target.closest("[data-android-retry]")) W.set("android", "ok");
    if (e.target.closest("[data-ios-demo]")) e.preventDefault();
    var c = e.target.closest("[data-chapter]");
    if (c && !c.disabled) goChapter(Number(c.getAttribute("data-chapter")), true);
    if (e.target.closest("[data-all]")) { showAll = !showAll; renderRules(); document.querySelector("[data-all]").focus(); }
  });

  document.addEventListener("change", function (e) {
    if (e.target.id === "chapter-pick") { goChapter(Number(e.target.value), false); $("chapter-pick").focus(); }
  });

  /* A shared article link opens the chapter that holds it. */
  function fromHash() {
    var m = location.hash.match(/^#(a|ch)(\d+)$/), r = W.rules();
    if (!m || !r) return;
    var idx = r.chapters.findIndex(function (c) { return c.id === m[0].slice(1) || c.articles.some(function (a) { return a.id === m[0].slice(1); }); });
    if (idx === -1) return;
    goChapter(idx, false);
    var t = document.getElementById(m[0].slice(1));
    if (t) t.scrollIntoView();
  }
  window.addEventListener("hashchange", fromHash);
  fromHash();
})();
</script>
</body>
</html>
